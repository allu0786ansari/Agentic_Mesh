<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><style>text{font:16px sans-serif;fill:#17202a}.box{stroke:#17202a;stroke-width:2;rx:8}.arrow{stroke:#17202a;stroke-width:2;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#17202a"/></marker></defs><text x="470" y="35" font-size="24">11-step data flow</text><g transform="translate(30,80)"><rect class="box" width="150" height="70" fill="#d9edf7"/><text x="48" y="42">Telemetry</text><rect class="box" x="180" width="150" height="70" fill="#dff0d8"/><text x="225" y="42">Edge</text><rect class="box" x="360" width="150" height="70" fill="#fcf8e3"/><text x="410" y="42">Flower</text><rect class="box" x="540" width="150" height="70" fill="#f2dede"/><text x="590" y="42">Qdrant</text><rect class="box" x="720" width="150" height="70" fill="#e8dff5"/><text x="760" y="42">Triage</text><rect class="box" x="900" width="150" height="70" fill="#e8dff5"/><text x="940" y="42">Agents</text><path class="arrow" d="M150 35 H180"/><path class="arrow" d="M330 35 H360"/><path class="arrow" d="M510 35 H540"/><path class="arrow" d="M690 35 H720"/><path class="arrow" d="M870 35 H900"/></g><text x="120" y="240">1 ingest</text><text x="300" y="240">2 score/embed</text><text x="470" y="240">3 aggregate</text><text x="640" y="240">4 retrieve</text><text x="800" y="240">5 escalate</text><text x="950" y="240">6-11 investigate, classify, dispatch, audit</text></svg>
[project]
name = "agentic-mesh"
version = "0.1.0"
description = "Decentralized Agentic Mesh for Privacy-Preserving Industrial Analytics"
authors = [{ name = "Allaudin Ansari" }]
requires-python = ">=3.12"
readme = "README.md"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

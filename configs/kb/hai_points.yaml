# HAI 21.03 point glossary for the evidence renderer (ADR 0010 §3).
# Transcribed from the HAI technical details point list (icsdataset/hai @ 2a814ce,
# hai_dataset_technical_details.pdf, printed pp. 12-14). Descriptions are verbatim,
# including the source's own wording (e.g. P2_VTR04 names P2_VIBTR03).
# 21.03 column names that differ from the document's use the document's own
# parenthesised names (VYT02 = VIBTR01, ...), or the aliases of mapping protocol §2.
# P2_SIT02 and P2_HILout are not in the point list: only their type is rendered.
processes:
  P1: boiler process
  P2: turbine process
  P3: water-treatment process
  P4: hardware-in-the-loop power-grid simulation

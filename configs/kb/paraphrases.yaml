  - id: p22
    incident: site_a/test5:e10
    text: >-
      Turbine governor output fell on a2 and the shaft slowed; displacement and phasor
      signals moved and the emergency and on/off inputs changed.
  - id: p23
    incident: site_a/test5:e10
    text: >-
      Speed control output decreased, RPM dropped, and normally fixed turbine safety

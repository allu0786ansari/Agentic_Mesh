[project]
name = "agmesh"
version = "3.0.0.dev0"
description = "Decentralized Agentic Mesh for Privacy-Preserving Industrial Analytics (v3 redesign)"
authors = [{ name = "Allaudin Ansari" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Core dependencies: light enough for CI and every phase.
# Heavier stacks live in dependency groups and are added in the week that needs them.
dependencies = [
    "httpx>=0.27",
    "langgraph>=1.0,<2",  # Week 10 agent mesh (ADR 0012); pure Python, needed by CI's mesh tests
    "numpy>=1.26",
    "pandas>=2.2",
    "psutil>=5.9",
    "pyarrow>=16",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scikit-learn>=1.9.1",
    # Week 11 process boundaries (ADR 0014): node APIs over mTLS, per-request JWTs, traces
    "cryptography>=43",
    "fastapi>=0.115",
    "openinference-semantic-conventions>=0.1.20",
    "opentelemetry-sdk>=1.30",
    "pyjwt[crypto]>=2.9",
    "uvicorn>=0.49",  # ssl_context_factory (TLS 1.3-only server context)
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-psutil>=5.9",
    "types-pyyaml>=6.0",
]
# Federated learning stack (Week 1 Ray/Flower spike; used from Week 6).
# Torch comes from the CPU-only PyTorch index (see [tool.uv.sources]).
fl = [
    "flwr[simulation]>=1.39,<1.40",
    "torch>=2.5",
]
ml = [
    "opacus>=1.6,<1.7",
    "torch>=2.5",
]
# Knowledge base and retrieval (Week 9, ADR 0010): embedded Qdrant, MiniLM encoder, NIST PDF text.
kb = [
    "pypdf>=5,<7",
    "qdrant-client>=1.12,<2",
    "sentence-transformers>=3.0,<6",
    "torch>=2.5",
]

# Optional trace viewer (ADR 0014 §7): Phoenix and the OTLP exporter, not resident by default.
obs = [
    "arize-phoenix>=8",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agmesh"]

# ---------------------------------------------------------------------------
# Quality gates (WR-7): Ruff for lint and format, mypy, pytest.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
# Ground-truth review evidence: kept verbatim as run, not product code.
extend-exclude = ["evaluation/ground_truth/pass2"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "S"]
ignore = [
    "S101",   # assert is fine in tests
    "S603",   # subprocess calls use fixed argv lists, never a shell
    "S607",   # partial executable paths (git, tshark, capinfos) are resolved on PATH by design
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311"]

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts", "tests"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["flwr.*", "ray.*", "torch.*", "sklearn.*", "opacus.*", "qdrant_client.*", "sentence_transformers.*", "huggingface_hub.*", "pypdf.*", "langgraph.*", "opentelemetry.exporter.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Flower is only installed with the 'fl' group; without it its decorators are untyped.
module = ["agmesh.feasibility.ray_bench", "agmesh.federated.flower", "agmesh.federated.secagg"]
disallow_untyped_decorators = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "fl: needs the 'fl' dependency group (flwr, ray, torch)",
]

[tool.coverage.run]
source = ["src/agmesh"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

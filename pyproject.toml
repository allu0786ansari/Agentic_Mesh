[project]
name = "agmesh"
version = "3.0.0.dev0"
description = "Decentralized Agentic Mesh for Privacy-Preserving Industrial Analytics (v3 redesign)"
authors = [{ name = "Allaudin Ansari" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Core dependencies: light enough for CI and every phase.
# Heavier stacks live in dependency groups and are added in the week that needs them.
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "psutil>=5.9",
    "pyarrow>=16",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-psutil>=5.9",
    "types-pyyaml>=6.0",
]
# Federated learning stack (Week 1 Ray/Flower spike; used from Week 6).
# Torch comes from the CPU-only PyTorch index (see [tool.uv.sources]).
fl = [
    "flwr[simulation]>=1.39,<1.40",
    "torch>=2.5",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agmesh"]

# ---------------------------------------------------------------------------
# Quality gates (WR-7): Ruff for lint and format, mypy, pytest.
# legacy/ holds the v2.1 code for reference only and is excluded everywhere.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "S"]
ignore = [
    "S101",   # assert is fine in tests
    "S603",   # subprocess calls use fixed argv lists, never a shell
    "S607",   # partial executable paths (git, tshark, capinfos) are resolved on PATH by design
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311"]

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts", "tests"]
exclude = ["^legacy/"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["flwr.*", "ray.*", "torch.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Flower is only installed with the 'fl' group; without it its decorators are untyped.
module = ["agmesh.feasibility.ray_bench"]
disallow_untyped_decorators = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "fl: needs the 'fl' dependency group (flwr, ray, torch)",
]

[tool.coverage.run]
source = ["src/agmesh"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
